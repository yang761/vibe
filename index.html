<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Timer</title>
    <style>
        body { font-family: Arial, sans-serif; }
        #timer { font-size: 48px; }
        #encouragement { font-size: 24px; margin-top: 20px; }
        #history { margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Learning Timer</h1>
    <div id="timer">25:00</div>
    <button id="startBtn">Start</button>
    <button id="resetBtn">Reset</button>
    <div id="encouragement"></div>
    <div id="history"></div>

    <script>
        let timeLeft = 1500; // 25 minutes
        let timerInterval;
        const timerDisplay = document.getElementById('timer');
        const encouragementDisplay = document.getElementById('encouragement');
        const historyDisplay = document.getElementById('history');
        let history = [];

        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function startTimer() {
            encouragementDisplay.textContent = "Keep going! You can do it!";
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    encouragementDisplay.textContent = "Great job! Take a break!";
                    history.push(new Date().toLocaleString());
                    updateHistoryDisplay();
                } else {
                    timeLeft--;
                    updateTimerDisplay();
                }
            }, 1000);
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timeLeft = 1500;
            updateTimerDisplay();
            encouragementDisplay.textContent = "";
        }

        function updateHistoryDisplay() {
            historyDisplay.innerHTML = "History:<br>" + history.map(entry => `<li>${entry}</li>`).join('');
        }

        document.getElementById('startBtn').addEventListener('click', startTimer);
        document.getElementById('resetBtn').addEventListener('click', resetTimer);

        updateTimerDisplay();
    </script>
</body>
</html>
