<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Countdown Timer</title>
    <style>
        body { font-family: Arial, sans-serif; }
        #encouragement { font-size: 1.5em; margin-top: 20px; }
    </style>
</head>
<body>

    <h1>Learning Countdown Timer</h1>
    <div id="timer"></div>
    <div id="encouragement"></div>
    <button id="startButton">Start Learning</button>
    
    <script>
        const animals = ['🐶 Dog', '🐱 Cat', '🐰 Rabbit', '🦖 Dinosaur', '🦄 Unicorn'];
        const encouragements = [
            'Keep going!', 
            'You can do it!', 
            'Great job!', 
            'Almost there!', 
            'You’re learning!'];
        let totalStudyTime = localStorage.getItem('totalStudyTime') ? parseInt(localStorage.getItem('totalStudyTime')) : 0;

        function updateEncouragement() {
            const randomAnimal = animals[Math.floor(Math.random() * animals.length)];
            const randomMessage = encouragements[Math.floor(Math.random() * encouragements.length)];
            document.getElementById('encouragement').innerText = `${randomAnimal} - ${randomMessage} (${totalStudyTime} min total)`;
        }

        function startTimer(duration) {
            let timer = duration, minutes, seconds;
            const timerDiv = document.getElementById('timer');
            const interval = setInterval(function () {
                minutes = parseInt(timer / 60, 10);
                seconds = parseInt(timer % 60, 10);
                timerDiv.innerText = `${minutes} min ${seconds} sec remaining`;

                if (--timer < 0) {
                    clearInterval(interval);
                    updateEncouragement();
                    totalStudyTime += duration / 60; // Convert seconds to minutes
                    localStorage.setItem('totalStudyTime', totalStudyTime);
                }
            }, 1000);
        }

        document.getElementById('startButton').onclick = function () {
            const learningDuration = 30 * 60; // 30 minutes in seconds
            startTimer(learningDuration);
        };
    </script>

</body>
</html>
